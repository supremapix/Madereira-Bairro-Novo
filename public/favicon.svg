<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#d97706" stroke-width="12" stroke-opacity="0.3"/>
  
  <!-- Timber Log Mark -->
  <g transform="translate(256, 256)">
    <!-- Pine Tree Symbol -->
    <path d="M 0 -150 L 110 0 L 50 0 L 130 110 L -130 110 L -50 0 L -110 0 Z" fill="url(#woodGrad)"/>
    <!-- Trunk -->
    <rect x="-32" y="110" width="64" height="60" rx="10" fill="#78350f"/>
    <!-- Inner rings accent -->
    <path d="M 0 -100 L 70 0 L 30 0 L 80 70 L -80 70 L -30 0 L -70 0 Z" fill="#fbbf24" opacity="0.25"/>
  </g>
</svg>
